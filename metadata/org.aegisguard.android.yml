AutoName: AegisGuard
Summary: Hardware line-rate, zero-drain systemwide ad and tracker sinkhole

Description: |-
  AegisGuard is an autonomous, ultra-high-performance systemwide ad blocker,
  telemetry sinkhole, and privacy guard designed for modern Android.

  Operating entirely on-device via a zero-copy local TUN packet filter, AegisGuard
  achieves the speed and efficiency of rooted kernel hosts modifications without
  requiring root access, without unlocking the bootloader, and without tripping
  Google Play Integrity or banking apps.

